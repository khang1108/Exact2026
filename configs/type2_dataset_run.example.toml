# Type 2 only dataset run config.
# Copy to configs/type2_local.toml and edit backend/model values for each run.

[dataset]
input = "src/exact/datasets/exact/Physics_Problems_Text_Only.csv"
limit = 10
skip_invalid = true
task_filter = "type2"

[output]
path = "artifacts/predictions/type2/type2_config_smoke.json"
include_gold = true
include_raw = false
progress_every = 1

[llm]
# transformers | ollama | openai_compatible | huggingface | groq
#
# Type 2 is PoT-first: retrieve formulas, ask the LLM to generate Pint code,
# execute in the sandbox, verify answer/unit/formula IDs, then generate final
# evidence. A real LLM backend is required.
backend = "ollama"
enabled = true
model = "ministral-3:8b-cloud"
api_key_env = ""

max_tokens = 512
temperature = 0.0
top_p = 1.0
timeout_seconds = 60.0
max_retries = 2

# Ollama local daemon provides an OpenAI-compatible endpoint. Cloud models still
# go through the local Ollama daemon after `ollama signin`.
base_url = "http://127.0.0.1:11434/v1"
api_key = ""

# For ollama:
# backend = "ollama"
# enabled = true
# model = "qwen2.5:0.5b"
# base_url = "http://127.0.0.1:11434/v1"

# For Groq:
# backend = "groq"
# enabled = true
# model = "llama-3.1-8b-instant"
# api_key_env = ""

# For transformers CPU:
# backend = "transformers"
# enabled = true
# model = "Qwen/Qwen2.5-0.5B-Instruct"
# device_map = "cpu"
# torch_dtype = "float32"
device_map = "cpu"
torch_dtype = "float32"
local_files_only = false
trust_remote_code = false

[pipeline]
# PoT-first Type 2 requires LLM extraction/code/explanation calls.
use_type2_llm_fallback = true

fail_fast = false

[type2_pipeline]
# Documented knobs for Type 2 experiments.
# Current code uses PoT-first solving:
#   extraction for formula retrieval support
#   executable + JSON formula context retrieval
#   LLM-generated Pint code
#   sandbox execution
#   PoT verifier
#   LLM final explanation/evidence
solver_mode = "pot_first"
deterministic_first = false
extraction_mode = "llm_preferred"
use_formula_bank = true
use_unit_verifier = true
use_concept_bank = true
use_extraction_verifier = true
use_llm_formula_selection = false
use_pot_solver = true
# false skips the final LLM explanation/evidence call after verified code execution.
# The output still includes answer, unit, confidence, and a compact code explanation.
generate_final_explanation = true

[evaluation]
# Numerical answers are compared after unit conversion when possible.
relative_tolerance = 0.02
absolute_tolerance = 1e-9
case_sensitive_text = false
report_path = "artifacts/reports/type2_eval_report.json"
errors_path = "artifacts/reports/type2_eval_errors.csv"

[model_pull]
enabled = false
revision = "main"
cache_dir = ""
local_dir = ""
allow_patterns = []
ignore_patterns = []
