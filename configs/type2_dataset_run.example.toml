# Unified Type 2 pipeline config.
# Copy to configs/type2_local.toml and tune dataset/output/type2_pipeline/evaluation.
# The LLM client/backend is chosen from scripts/type2/run_type2.py, not in this TOML.

[dataset]
input = "src/exact/datasets/exact/type2_physics_questions.csv"
limit = 500
skip_invalid = true
task_filter = "type2"

[output]
path = "artifacts/predictions/type2/type2_config_smoke.json"
# Optional standalone route diagnostics log. Use .jsonl for one JSON object per row.
# routing_log_path = "artifacts/logs/type2_routing_logs.jsonl"
include_gold = true
include_raw = false
progress_every = 1

[type2_pipeline]
# Runtime knobs read by `build_settings_from_config()`.
# Domain routing: use the configured LLM first; fallback to ID/keyword heuristics if unavailable.
use_llm_domain_routing = true

# `extraction_mode`: merge | llm_only | heuristic_only
extraction_mode = "merge"
use_extraction_verifier = true

# Retrieval / reranking
use_formula_bank = true
use_llm_formula_selection = true
force_llm_formula_selection = false

# Solving: executable formulas run before LLM PoT code generation.
use_pot_solver = true
deterministic_first = true
use_executable_fallback = true
use_unit_verifier = true
use_concept_bank = true

# Skip the final explanation LLM call when false.
generate_final_explanation = true

# Per-task LLM output budgets
domain_routing_max_tokens = 256
extraction_max_tokens = 512
formula_selection_max_tokens = 1024
conceptual_max_tokens = 1024
pot_code_max_tokens = 3072
pot_repair_max_tokens = 2048
final_explanation_max_tokens = 1024

# Debugging: dump the exact PoT coding/repair prompts before sending them to the LLM.
# debug_log_pot_prompts = true
# debug_pot_prompt_log_path = "artifacts/debug/type2_pot_prompts.jsonl"

pot_max_retries = 3
pot_batch_size = 3
pot_batch_temperature = 0.4
formula_limit = 24
rerank_limit = 8
pot_timeout = 10.0

[evaluation]
# Numeric-only evaluation with unit conversion when possible.
# Conceptual-only outputs are reported but excluded from accuracy.
relative_tolerance = 0.02
absolute_tolerance = 1e-9
case_sensitive_text = false
report_path = "artifacts/reports/type2_eval_report.json"
errors_path = "artifacts/reports/type2_eval_errors.csv"
