# Type 2 dataset runner config for the current rebuilt pipeline.
# Copy to configs/type2_local.toml and tune dataset/output/type2_pipeline/evaluation.
#
# Important:
# - This runner can operate without an LLM for deterministic Type 2 execution.
# - Set [llm].require_llm = true if you want to enforce a live vLLM backend.
# - This file intentionally keeps only keys that still have real effect in the
#   current Type 2 pipeline or dataset runner.

[dataset]
input = "src/exact/datasets/exact/type2_physics_questions.csv"
limit = 500
skip_invalid = true

[output]
path = "artifacts/predictions/type2/type2_config_smoke.json"
# Optional standalone route diagnostics log. Use .jsonl for one JSON object per row.
# routing_log_path = "artifacts/logs/type2_routing_logs.jsonl"
include_gold = true
include_raw = false
progress_every = 1

[llm]
# Optional. Leave disabled for deterministic-only runs.
require_llm = true
# Supported backend today: vllm
# backend = "vllm"
# enabled = true
# base_url = "http://127.0.0.1:8000/v1"
# model = "Qwen/Qwen2.5-7B-Instruct"
# api_key = "EMPTY"

[type2_pipeline]
# Retrieval / planning knobs still consumed by the current pipeline.
use_formula_bank = true

# The runner forwards this into `set_generate_final_explanation()`.
generate_final_explanation = true
formula_limit = 24

[evaluation]
# Numeric-only evaluation with unit conversion when possible.
# Conceptual-only outputs are reported but excluded from accuracy.
# Choose from: all, numeric_with_unit, numeric_unitless, symbolic, textual_conceptual
answer_types = ["all"]
relative_tolerance = 0.02
absolute_tolerance = 1e-9
case_sensitive_text = false
report_path = "artifacts/reports/type2_eval_report.json"
errors_path = "artifacts/reports/type2_eval_errors.csv"
