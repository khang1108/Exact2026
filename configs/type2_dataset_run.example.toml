# Unified Type 2 pipeline config.
# Copy to configs/type2_local.toml and tune dataset/output/type2_pipeline/evaluation.
# The LLM client/backend is chosen from scripts/type2/run_type2.py, not in this TOML.

[dataset]
input = "src/exact/datasets/exact/type2_physics_questions.csv"
limit = 10
skip_invalid = true
task_filter = "type2"

[output]
path = "artifacts/predictions/type2/type2_config_smoke.json"
include_gold = true
include_raw = false
progress_every = 1

[type2_pipeline]
# Runtime knobs read by `build_settings_from_config()`.
# `extraction_mode`: merge | llm_only | heuristic_only
extraction_mode = "merge"
use_extraction_verifier = true

# Retrieval / reranking
use_formula_bank = true
use_llm_formula_selection = true
force_llm_formula_selection = false

# Solving
use_pot_solver = true
deterministic_first = false
use_executable_fallback = true
use_unit_verifier = true
use_concept_bank = true

# Skip the final explanation LLM call when false.
generate_final_explanation = true
pot_max_retries = 3
formula_limit = 24
rerank_limit = 12
pot_timeout = 10.0

[evaluation]
# Numeric-only evaluation with unit conversion when possible.
# Conceptual-only outputs are reported but excluded from accuracy.
relative_tolerance = 0.02
absolute_tolerance = 1e-9
case_sensitive_text = false
report_path = "artifacts/reports/type2_eval_report.json"
errors_path = "artifacts/reports/type2_eval_errors.csv"
