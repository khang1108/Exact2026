[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "exact2026"
version = "0.1.0"
description = "EXACT 2026 Type 2 physics pipeline"
readme = "README.md"
authors = [
    { name = "Khang Phuc Nguyen", email = "phuckhang@gmail.com" },
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "sympy>=1.12",
    "pint>=0.23",
    "pandas>=2.0",
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pydantic-settings>=2.10.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
dev = ["ruff", "mypy", "pre-commit"]
model-tools = ["huggingface_hub>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
where = ["src"]
