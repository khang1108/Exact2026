# Type 1 logic dataset run config.
# Copy to configs/type1_local.toml and edit base_url/model for your vLLM server.

[dataset]
input = "src/exact/datasets/exact/Logic_Based_Educational_Queries.json"
limit = 20
skip_invalid = true
task_filter = "type1"

[output]
path = "artifacts/predictions/type1/type1_config_run.json"
include_gold = true
include_raw = false
progress_every = 1

[llm]
# openai_compatible | ollama | groq | huggingface | transformers
backend = "openai_compatible"
enabled = true
model = "Qwen/Qwen2.5-7B-Instruct"
base_url = "http://127.0.0.1:8000/v1"
api_key = "EMPTY"

max_tokens = 1024
temperature = 0.0
top_p = 1.0
timeout_seconds = 60.0
max_retries = 2

[pipeline]
use_type1_llm = true
use_type2_llm_fallback = false
type1_enable_cot_fallback = false
fail_fast = false
